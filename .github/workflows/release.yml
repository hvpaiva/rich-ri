# A pushed v* tag publishes; bin/release creates that tag after the release pull request is
# merged. A manual run is a rehearsal: it verifies, builds and installs the gem, and can only
# publish when it is started from a tag with dry_run turned off.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and build without publishing
        type: boolean
        default: true

# The default for every job; the three that need more say so below.
permissions:
  contents: read

# A second run for the same ref waits: a publication is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A reusable workflow call is resolved before any step runs, at the commit of this run, so
  # no checkout during the run can change what "./" loads. zizmor suggests the newer "$/"
  # spelling of the same reference: a matter of style, not of what is executed.
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      force_full: true
    permissions:
      contents: read

  verify:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      # The whole history, so origin/main and origin/hotfix/* exist for the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No bundler cache in this workflow: a cache written by another run must never feed a
      # release. BUNDLE_FROZEN installs exactly Gemfile.lock.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - run: bundle install
        env:
          BUNDLE_FROZEN: 'true'
      - run: sudo apt-get update && sudo apt-get install -y groff man-db
      - name: Verify the tag and its ancestry
        if: github.ref_type == 'tag'
        run: |
          bundle exec rake release:verify release:verify_ref
      # The gem is built once. Later jobs download this artifact and compare its checksum
      # instead of building again.
      - id: artifact
        run: |
          bundle exec rake release:artifact
          bundle exec rake "package:check[pkg/rich-ri-$(ruby -Ilib -rrich_ri/version -e 'print RichRI::VERSION').gem]"
          echo "sha256=$(cut -d ' ' -f 1 pkg/SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gem
          path: pkg/
          if-no-files-found: error
      - id: decision
        env:
          PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  attest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # signs the attestation with the identity of this workflow run
      attestations: write # stores the attestation in this repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gem
          path: pkg
      - name: Verify the artifact before attesting it
        env:
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$RELEASE_SHA256"
      # An attestation is public and permanent, and names only the repository and workflow.
      # A rehearsal therefore stops after checking the transferred artifact: a gem built from
      # an unreleased commit must not verify as a build of this project.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: needs.verify.outputs.publish == 'true'
        with:
          subject-path: pkg/*.gem
          create-storage-record: false

  publish:
    needs: [verify, attest]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The RubyGems trusted publisher is bound to this workflow file and this environment,
    # which only v* tags may enter.
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged with RubyGems for a short-lived push credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gem
          path: pkg
      - run: bundle install
        env:
          BUNDLE_FROZEN: 'true'
      - run: bundle exec rake release:verify_artifact
        env:
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: bundle exec rake release
        env:
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}

  # A job of its own because RubyGems refuses a version it already has: after a failure here,
  # rerunning this job alone creates the release without attempting a second push.
  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gem
          path: pkg
      - name: Verify the artifact and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$RELEASE_SHA256"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md ./*.gem SHA256SUMS
