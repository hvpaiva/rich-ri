name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and build without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      force_full: true
    permissions:
      contents: read

  verify:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - run: bundle install
        env:
          BUNDLE_FROZEN: 'true'
      - run: sudo apt-get update && sudo apt-get install -y groff man-db
      - name: Verify the tag and its ancestry
        if: github.ref_type == 'tag'
        run: |
          bundle exec rake release:verify release:verify_ref
      - id: artifact
        run: |
          bundle exec rake release:artifact
          bundle exec rake "package:check[pkg/rich-ri-$(ruby -Ilib -rrich_ri/version -e 'print RichRI::VERSION').gem]"
          echo "sha256=$(cut -d ' ' -f 1 pkg/SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gem
          path: pkg/
          if-no-files-found: error
      - id: decision
        env:
          PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  attest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gem
          path: pkg
      - name: Verify the artifact before attesting it
        env:
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$RELEASE_SHA256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pkg/*.gem
          create-storage-record: false

  publish:
    needs: [verify, attest]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gem
          path: pkg
      - run: bundle install
        env:
          BUNDLE_FROZEN: 'true'
      - run: bundle exec rake release:verify_artifact
        env:
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: bundle exec rake release
        env:
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gem
          path: pkg
      - name: Verify the artifact and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          cd pkg
          sha256sum --check SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$RELEASE_SHA256"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md ./*.gem SHA256SUMS
