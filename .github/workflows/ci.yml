name: CI

on:
  push:
    branches: [main, 'hotfix/*']
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # Mondays, 07:23 UTC. GitHub delays or drops schedules that start on the hour, when most do.
  schedule:
    - cron: '23 7 * * 1'
  # A manual run always uses the full suite, for example after a missed schedule.
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        description: Run the full suite regardless of changed files
        type: boolean
        default: true

permissions:
  contents: read

# A newer commit replaces the run of the pull request it belongs to. Every other run has a
# group of its own: a shared group keeps one run and one waiting run and cancels the rest, so
# a merge to main or a hotfix branch could be left without its complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - id: scope
        env:
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scope=$(ruby bin/ci scope)
          echo "$scope" >> "$GITHUB_OUTPUT"
          echo "$scope"

  docs:
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: typos lychee
      - run: bundle exec rake docs:check

  quality:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: shellcheck typos zizmor lychee
      - run: sudo apt-get update && sudo apt-get install -y groff man-db zsh fish bash-completion bat
      - name: Make the optional bat executable available
        run: |
          mkdir -p "$RUNNER_TEMP/rich-ri-tools"
          ln -s /usr/bin/batcat "$RUNNER_TEMP/rich-ri-tools/bat"
          echo "$RUNNER_TEMP/rich-ri-tools" >> "$GITHUB_PATH"
      - run: bundle exec rake check
      - name: Test shell integrations in an isolated environment
        run: bundle exec rake test:shells:container
      - run: bundle exec ruby bin/benchmark --output benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: benchmark.json

  test:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RICH_RI_REQUIRE_SHELLS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.4', '4.0']
        include:
          - os: macos-latest
            ruby: '4.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y groff man-db bash-completion zsh fish
      - if: runner.os == 'macOS'
        run: brew install groff bash bash-completion@2 fish
      - run: bundle exec rake test package:check

  audit:
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'scheduled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - run: bundle exec rake audit

  # Resolves every gem again instead of using Gemfile.lock. The weekly run includes it, so a
  # new RDoc or Reline release that breaks the reader shows up without waiting for a commit.
  fresh-dependencies:
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'scheduled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RICH_RI_REQUIRE_SHELLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - run: sudo apt-get update && sudo apt-get install -y groff man-db bash-completion zsh fish
      - run: bundle update --all
      - run: bundle exec rake test package:check

  compatibility:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
      - run: sudo apt-get update && sudo apt-get install -y groff man-db bash-completion zsh fish
      # The command contributors run through bundle exec rake test:compatibility. It installs
      # the RDoc 6.14 bundle and the minimum bundle in private directories and needs no other.
      - name: Test the minimum runtime dependencies and an older store
        env:
          RICH_RI_REQUIRE_SHELLS: '1'
        run: ruby bin/test-compatibility

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      # The title and body reach the script through the environment, never through template
      # expansion inside the command.
      - name: Check the commits and the pull request title and body
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ruby bin/lint-commits "origin/$BASE_REF..HEAD"
      # The same check as bundle exec rake lint:changelog. The skip-changelog label waives the
      # entry for changes users cannot see; the structure of the file is always checked.
      - name: Require a changelog entry for changes users can see
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: ruby bin/lint-changelog "origin/$BASE_REF"

  ci:
    if: ${{ always() }}
    needs: [changes, docs, quality, test, audit, fresh-dependencies, compatibility, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Verify all expected jobs completed
        env:
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: ruby bin/ci verify
