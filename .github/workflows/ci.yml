name: CI

on:
  push:
    branches: [main, 'hotfix/*']
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 7 * * 1'
  workflow_call:
    inputs:
      force_full:
        description: Run the full suite regardless of changed files
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - id: scope
        env:
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scope=$(ruby bin/ci scope)
          echo "$scope" >> "$GITHUB_OUTPUT"
          echo "$scope"

  docs:
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: typos lychee
      - run: bundle exec rake docs:check

  quality:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: shellcheck typos zizmor lychee
      - run: sudo apt-get update && sudo apt-get install -y groff man-db zsh fish bash-completion bat
      - name: Make the optional bat executable available
        run: |
          mkdir -p "$RUNNER_TEMP/rich-ri-tools"
          ln -s /usr/bin/batcat "$RUNNER_TEMP/rich-ri-tools/bat"
          echo "$RUNNER_TEMP/rich-ri-tools" >> "$GITHUB_PATH"
      - run: bundle exec rake check
      - run: bundle exec ruby bin/benchmark --output benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: benchmark.json

  test:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RICH_RI_REQUIRE_SHELLS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.4', '4.0']
        include:
          - os: macos-latest
            ruby: '4.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y groff man-db bash-completion zsh fish
      - if: runner.os == 'macOS'
        run: brew install groff bash bash-completion@2 fish
      - run: bundle exec rake test package:check

  audit:
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - run: bundle exec rake audit

  fresh-dependencies:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RICH_RI_REQUIRE_SHELLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - run: sudo apt-get update && sudo apt-get install -y groff man-db bash-completion zsh fish
      - run: bundle update
      - run: bundle exec rake test package:check

  compatibility:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
      - run: sudo apt-get update && sudo apt-get install -y groff man-db bash-completion zsh fish
      - name: Generate an older RI store
        run: |
          BUNDLE_GEMFILE=gemfiles/legacy.gemfile bundle install
          BUNDLE_GEMFILE=gemfiles/legacy.gemfile bundle exec ruby -rrdoc/rdoc -e \
            'RDoc::RDoc.new.document(ARGV)' -- --ri --quiet --op "$RUNNER_TEMP/legacy-ri" test/fixtures/example.rb
      - name: Test the minimum runtime dependencies and older store
        env:
          LEGACY_RI_STORE: ${{ runner.temp }}/legacy-ri
          BUNDLE_GEMFILE: gemfiles/minimum.gemfile
          RICH_RI_REQUIRE_SHELLS: '1'
        run: |
          bundle install
          bundle exec ruby bin/test-compatibility

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Validate commits and the changelog
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          ruby bin/lint-commits "origin/$BASE_REF..HEAD"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if grep -qE '^(lib|exe|completions)/' <<< "$changed" &&
             ! grep -qx 'CHANGELOG.md' <<< "$changed" && [ "$SKIP_CHANGELOG" != true ]; then
            echo '::error::Add a user-visible change under Unreleased in CHANGELOG.md.'
            exit 1
          fi

  ci:
    if: ${{ always() }}
    needs: [changes, docs, quality, test, audit, fresh-dependencies, compatibility, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Verify all expected jobs completed
        env:
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: ruby bin/ci verify
