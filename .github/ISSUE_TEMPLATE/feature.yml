name: Feature request
description: A way of reading documentation that could work better
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where rich-ri gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command line, option, setting or output you have in mind.
      placeholder: |
        $ rich-ri --theme=light Array#map
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to get the same result, in rich-ri, ri or another tool, and why they fall short.
